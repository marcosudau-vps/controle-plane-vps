name: Control Plane checks
on:
  pull_request:
  push:
    branches: [main, feat/control-plane-completion]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: selfhost_control
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ctpl_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfhost_control -d ctpl_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.lock
      - run: python -m pip install -e '.[test]' playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y zstd docker-compose-v2
      - run: python -m pytest --junitxml=test-results.xml
        env:
          CP_TEST_POSTGRES_URL: postgresql://selfhost_control:synthetic-ci-only@127.0.0.1:5432/ctpl_test_ci
          CP_LIVE_DOCKER_TESTS: '1'
          CP_BROWSER_TESTS: '1'
          CP_BROWSER_ARTIFACT_DIR: /tmp/ctpl-browser-ci
